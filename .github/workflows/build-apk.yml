name: Build Cutout Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android release APK (small)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository does not ship gradlew / gradle-wrapper.jar, so use the Gradle version
      # that matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # CI-only keystore so the *release* build (R8 + resource shrinking = small APK) can be signed.
      # For Google Play, replace it with your own upload key and keep it secret.
      - name: Create CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storepass android123 -keypass android123 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Cutout Pro CI"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cutout-Pro-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
